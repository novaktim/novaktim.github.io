<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2 vs 2 Tennis Evolution Demo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="sketch.js" defer></script>
</head>
<body>
  <main>
    <section id="sketch-section">
      <div id="sketch-holder"></div>
      <div class="controls">
        <button id="start-stop-button" onclick="toggleSimulation()">Start</button>
        <button onclick="speedDown()">Slower</button>
        <button onclick="speedUp()">Faster</button>
      </div>
    </section>
  </main>
</body>
</html>
